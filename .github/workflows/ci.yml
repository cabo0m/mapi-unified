name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Bootstrap fresh instance
        run: mapi-init --non-interactive --root "${{ runner.temp }}/mapi-init-${{ matrix.os }}-${{ matrix.python }}" --agent-name CI-Agent
      - run: mapi-migrate
        env:
          MAPI_DB_PATH: ${{ runner.temp }}/mapi-core-${{ matrix.os }}-${{ matrix.python }}.db
      - run: mapi-seed-demo
        env:
          MAPI_DB_PATH: ${{ runner.temp }}/mapi-core-${{ matrix.os }}-${{ matrix.python }}.db
      - run: mapi-doctor
        env:
          MAPI_DB_PATH: ${{ runner.temp }}/mapi-core-${{ matrix.os }}-${{ matrix.python }}.db
      - run: pytest -m "not semantic"

  semantic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,semantic]"
      - run: pytest -m semantic

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q app mapi mapi_core mapi_capabilities mapi_platform scripts tests
      - run: python scripts/check_unified_wheel.py
      - run: mapi-capabilities
      - run: git diff --exit-code -- docs/CAPABILITIES.md
      - name: Audit pull-request contents
        if: github.event_name == 'pull_request'
        run: python scripts/audit_public_repository.py --pull-request
      - name: Audit published Git metadata and contents
        if: github.event_name != 'pull_request'
        run: python scripts/audit_public_repository.py
      - run: pytest tests/test_public_documentation.py

  windows-bundle-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Build, install and uninstall unified Windows bundle
        shell: powershell
        run: .\scripts\windows_install_smoke.ps1
